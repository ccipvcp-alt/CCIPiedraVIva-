name: Contenido de YouTube
on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos revisa videos nuevos y si hay un en vivo
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix enviar
      - run: node enviar/youtube.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
