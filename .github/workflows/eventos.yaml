name: Confirmación de inscripciones a eventos
on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos revisa inscripciones o pagos nuevos
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix enviar
      - run: node enviar/eventos.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
