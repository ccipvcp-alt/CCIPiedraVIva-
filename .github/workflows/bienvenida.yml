name: Correo de bienvenida a miembros
on:
  schedule:
    - cron: '*/30 * * * *'   # revisa cada 30 minutos si hay miembros nuevos aprobados
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
jobs:
  bienvenida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix enviar
      - run: node enviar/bienvenida.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
