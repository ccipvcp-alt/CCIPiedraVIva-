name: Anuncios semanales por correo
on:
  schedule:
    - cron: '0 12 * * 0'   # domingos 12:00 UTC = 8:00 a. m. hora de Venezuela
  workflow_dispatch:       # permite enviar manualmente desde la pestaña Actions
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix enviar
      - run: node enviar/enviar.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
